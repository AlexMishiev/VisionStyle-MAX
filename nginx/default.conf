# Порт 80 нужен certbot для проверки домена, остальные запросы уходят на https.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Порт 443 принимает webhook от MAX и передаёт его боту.
server {
    listen 443 ssl;
    server_name _;

    # сертификат сюда кладёт start.sh (из Let's Encrypt или временный)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # бот сам проверяет путь из MAX_WEBHOOK_URL и секрет
    location / {
        proxy_pass http://max:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
